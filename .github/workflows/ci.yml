name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Sin red ni LLM: Documental en modo retriever (BM25) y Gastos en modo código (ver tests/conftest.py).
      - run: pytest -q
      # Los 12 casos del artefacto con evaluadores determinísticos; falla si algún negativo no pasa.
      - name: Evaluación de punta a punta (sin LLM)
        env:
          DOCUMENTAL_MODO: retriever
          GASTOS_MODO: codigo
          INTAKE_MODO: reglas
        run: |
          python evaluation/e2e/correr.py | tee e2e.txt
          grep -q "sobrevive una ronda de negativos»: SÍ" e2e.txt

  # La misma suite contra Postgres, el motor de Supabase, para que los dos modos no se separen
  # (design D3 de cuentas-administracion).
  tests-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: eliseo
          POSTGRES_DB: eliseo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ELISEO_TEST_DB_URL: postgresql+psycopg://postgres:eliseo@localhost:5432/eliseo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [tests, tests-postgres]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t eliseo .
