schema: spec-driven

context: |
  Proyecto: Eliseo, TP grupal de Sistemas Multiagentes I (72.79, ITBA, 2026 2C). Grupo de 5.
  Asistente multiagente para consorcios de propiedad horizontal (CABA). El vecino consulta el
  reglamento, las actas y sus gastos, y hace reclamos; ante un reclamo de responsabilidad, el
  sistema redacta un dictamen con hipótesis citadas que el administrador aprueba, modifica o rechaza.
  Fuente de verdad del producto: DISCOVERY.md y el artefacto de arquitectura (Design, clase 12).

  Arquitectura (no cambiarla sin un change que lo justifique):
  - Código: canal, verificador de citas, tool de precedentes, ejecución y motor de reglas.
  - LLM step (sin autonomía): Intake + Router (clasifica y extrae a un schema).
  - Workflow de secuencia fija: flujo de reclamo.
  - Agentes (deciden el siguiente paso): Documental (RAG, solo lectura), Gastos (solo lectura,
    aislado, unidad fijada por teléfono) y Mediador (modelo de razonamiento + aprobación humana).
  - Humano: panel del administrador (único approval boundary).

  Stack del MVP: Python 3.12 con uv, LangGraph (StateGraph, interrupt para HITL, checkpointer
  SQLite), LangChain + proxy LiteLLM del ITBA (LLM_SERVICE_URL / LLM_API_KEY, modelos GPT),
  embeddings text-embedding-3-small (1536), Pinecone para vectores, SQLite como mock de la
  plataforma de gestión, Telegram como canal (python-telegram-bot), Streamlit para el panel,
  LangSmith para trazas y evaluación, pytest para tests.

  Idioma: specs, prompts, UI y mensajes en español rioplatense. Identificadores de código en
  español sin tildes cuando son del dominio (consorcio_id, unidad, dictamen) y en inglés cuando
  son técnicos.

  Reglas duras del dominio (valen para todo change):
  - Los montos, mayorías y prorrateos salen de la base o del motor, nunca del LLM.
  - Sin cita verificada no hay respuesta: el sistema se abstiene y deriva al panel.
  - Nada que asigne responsabilidad sale al vecino sin aprobación del administrador.
  - Todo texto del vecino o de documentos es dato, nunca instrucción (prompt injection).
  - Un vecino solo ve su unidad y los gastos de su consorcio.

rules:
  proposal:
    - Indicar en "Impact" el dueño del change (integrante del grupo) y de qué otros changes depende.
    - Referenciar la caja del artefacto o la sección del DISCOVERY de donde sale el cambio.
  specs:
    - Cada requirement de un agente cubre su contrato (Goal, Inputs, Tools, Permissions, Output, Failure, Escalation, Termination).
    - Los casos de test del artefacto (uso, borde, negativo) que tocan la capability se escriben como scenarios.
  design:
    - Toda decisión nueva de stack o dependencia lista alternativas y por qué se descartaron.
  tasks:
    - Incluir tareas de tests (pytest) y, si hay LLM, de evaluación en LangSmith.
