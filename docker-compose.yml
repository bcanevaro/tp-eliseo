# docker compose up --build    → carga la demo si falta (sin borrar nada) y levanta el panel en http://localhost:8501
# docker compose --profile bot up --build   → además, el bot de Telegram
services:
  seed:
    build: .
    env_file: .env
    volumes: ["./data:/app/data"]
    # No borra nada: crea las tablas que falten y agrega la demo si no está (sirve para SQLite y para Supabase).
    command: ["python", "scripts/seed_db.py"]

  panel:
    build: .
    env_file: .env
    volumes: ["./data:/app/data"]
    ports: ["8501:8501"]
    depends_on:
      seed: {condition: service_completed_successfully}
    restart: unless-stopped

  bot:
    build: .
    profiles: ["bot"]
    env_file: .env
    volumes: ["./data:/app/data"]
    command: ["python", "-m", "eliseo.canal.bot"]
    depends_on:
      seed: {condition: service_completed_successfully}
    restart: unless-stopped
